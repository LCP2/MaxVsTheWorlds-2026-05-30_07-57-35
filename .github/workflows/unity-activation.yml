name: Unity Activation (manual)

# Run by hand ONLY when CI's Unity licence stops activating — the symptom is
# "Machine bindings don't match" from the Licensing client, before any test runs.
#
# 1. Actions -> "Unity Activation (manual)" -> Run workflow (branch: main).
# 2. Download the "Manual Activation File" artifact and unzip it to get the .alf.
# 3. Upload that .alf at https://license.unity3d.com/manual, pick Unity Personal,
#    and download the .ulf it gives back.
# 4. Open the .ulf in a text editor, copy ALL of it, and paste it into the
#    UNITY_LICENSE repository secret (Settings -> Secrets and variables -> Actions).
# 5. Re-run QA on main. It should reach the EditMode suite instead of dying on activation.
#
# This workflow never runs on push and builds nothing. It only asks Unity for an
# activation file bound to the current hosted-runner image.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request the .alf for this runner
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.4.9f1

      - name: Upload the .alf as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
