name: iOS → TestFlight

# YT-99. Builds the iOS Xcode project (GameCI, on Linux — Unity only emits the
# project, it doesn't compile the app) and ships a signed build to TestFlight via
# Fastlane on a macOS runner. Kept SEPARATE from build.yml so the WebGL deploy is
# untouched, and gated so the expensive macOS minutes never run on a normal push.
#
# Triggers: manual (Actions → Run workflow) or pushing a version tag `vX.Y.Z`.
# All Apple credentials come from GitHub Actions secrets — see APPLE_SIGNING_SETUP.md.

on:
  # MV-414: the manual run takes the version as an INPUT. Before this, a dispatch had no way to
  # say what it was shipping, so it fell through to the 0.<milestone>.<run_number> guess in the
  # Fastfile - a number LOWER than what was already on TestFlight, which is why every build showed
  # as "Open" instead of "Update" and why a release meant hand-tagging from a shell every time.
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to ship, e.g. 0.8.1. Must be X.Y.Z. Leave blank only if you want the 0.<milestone>.<run number> fallback.'
        required: false
        type: string
  push:
    tags: ['v*']

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build the iOS Xcode project with GameCI. Runs on Linux (cheap) — Unity
  #    produces build/iOS/iOS/Unity-iPhone.xcodeproj; it does not sign anything.
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS Xcode project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          # iOS-specific key so it never collides with the WebGL job's Library cache.
          # MV-460: Assets/** deliberately NOT in the key. It changes on every commit, so the exact
          # key never hit, every run fell back to restore-keys AND uploaded a fresh ~GB cache.
          # Unity reimports changed assets from a restored Library anyway.
          key: Library-iOS-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-iOS-
            Library-
      # No dev-tools define step any more (YT-120). The tuning sliders are a real, always-
      # compiled in-game Settings panel now, so there is nothing to inject — which is the
      # whole point: the old step edited ProjectSettings.asset mid-build, dirtied the git
      # tree, and tripped the semantic-version guard ("Branch is dirty", YT-119). A clean
      # checkout builds a build that already has the sliders.
      - name: Build iOS target (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto # reads ProjectSettings/ProjectVersion.txt
          targetPlatform: iOS
      # Tar the project before uploading. actions/upload-artifact does NOT preserve
      # the executable bit, and Unity's generated project ships tools that must stay
      # executable (process_symbols.sh, usymtoolarm64, MapFileParser.sh, ...) or the
      # macOS archive fails with "Permission denied" in a build-phase script. A tar
      # round-trip keeps the modes, which fixes the whole class rather than chmod'ing
      # each file we happen to trip over.
      - name: Package the Xcode project (tar preserves file modes)
        run: tar -cf ios-build.tar -C build/iOS .
      - uses: actions/upload-artifact@v4
        with:
          name: build-iOS
          path: ios-build.tar
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2. Sign the Xcode project + upload to TestFlight. macOS only. Preflight is the
  #    FIRST step: with the Apple secrets absent it fails fast with a clear message,
  #    so the pipeline is green up to exactly the point that needs Lee's credentials.
  # ---------------------------------------------------------------------------
  release-ios:
    name: Sign & upload to TestFlight
    needs: build-ios
    runs-on: macos-15
    env:
      IOS_BUILD_PATH: ${{ github.workspace }}/build/iOS
      # MV-414: empty on a tag push (the tag is the version) and empty on a blank dispatch
      # (the Fastfile falls back). Set only when Lee typed a number into the Run-workflow form.
      RELEASE_VERSION: ${{ inputs.version }}
      # Apple credentials (all from secrets — empty until Lee configures them).
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
    steps:
      - name: Preflight — verify Apple secrets are configured
        shell: bash
        run: |
          required=(
            APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_P8_BASE64
            IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD
            IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME
            APPLE_TEAM_ID IOS_BUNDLE_ID
          )
          missing=()
          for name in "${required[@]}"; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing required Apple secret(s): %s\n' "${missing[*]}"
            echo "::error::Add them in Settings → Secrets and variables → Actions. See APPLE_SIGNING_SETUP.md for how to obtain each value."
            {
              echo "### ❌ iOS release blocked — missing GitHub secrets"
              echo ""
              echo "The iOS build succeeded, but signing/upload needs these secrets, which are not set:"
              echo ""
              for name in "${missing[@]}"; do echo "- \`$name\`"; done
              echo ""
              echo "Follow **APPLE_SIGNING_SETUP.md** in the repo to generate each value, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required Apple secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-iOS
          path: ${{ runner.temp }}/ios-artifact

      - name: Unpack the Xcode project
        shell: bash
        run: |
          mkdir -p build/iOS
          tar -xf "$RUNNER_TEMP/ios-artifact/ios-build.tar" -C build/iOS

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure iOS platform SDK
        run: xcodebuild -downloadPlatform iOS || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Decode signing assets
        shell: bash
        run: |
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

      - name: Fastlane — sign & upload to TestFlight
        working-directory: ${{ github.workspace }}
        run: bundle exec fastlane ios beta

      # xcbeautify swallows the stderr of failing run-script phases, so an archive
      # failure otherwise shows only "PhaseScriptExecution ... failed" with no
      # reason. Surface the raw gym log and the generated script on failure.
      - name: Diagnose archive failure
        if: failure()
        shell: bash
        run: |
          echo "::group::gym log (last 200 lines)"
          tail -n 200 ~/Library/Logs/gym/*.log 2>/dev/null || echo "no gym log"
          echo "::endgroup::"
          echo "::group::failing run-script phases"
          find ~/Library/Developer/Xcode/DerivedData -name 'Script-*.sh' 2>/dev/null | while read -r f; do
            echo "--- $f"
            cat "$f"
          done || true
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # 3. MV-484: tell Jira which tickets just shipped to TestFlight. Before this,
  #    ios-testflight.yml had no Jira write-back at all, so nothing in Jira
  #    ever recorded a TestFlight ship. Comment-only, never transitions status
  #    (that ladder is unchanged) and can never fail the release — mirrors the
  #    range logic and soft-fail posture of build.yml's jira-on-staging job.
  # ---------------------------------------------------------------------------
  jira-release-comment:
    name: Comment shipped tickets in Jira
    needs: [release-ios]
    if: success()
    runs-on: ubuntu-latest
    env:
      ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
      CURRENT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comment shipped tickets in Jira
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${ATLASSIAN_API_TOKEN:-}" ]; then
            echo "::notice::ATLASSIAN_API_TOKEN not set - skipping Jira write-back."
            exit 0
          fi
          BASE=$(jq -r '.jiraBaseUrl' pipeline.config.json)
          MAIL=$(jq -r '.jiraEmail' pipeline.config.json)
          PKEY=$(jq -r '.jiraProjectKey' pipeline.config.json)

          # Marketing version: explicit dispatch input, else the pushed tag (vX.Y.Z -> X.Y.Z),
          # else the Fastfile's own run-number fallback shape (see Fastfile RELEASE_VERSION).
          if [ -n "${RELEASE_VERSION:-}" ]; then
            VERSION="$RELEASE_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="run #$RUN_NUMBER fallback version (no tag, no dispatch input - see Fastfile)"
          fi
          echo "Marketing version: $VERSION"

          # Previous release point: the most recent other tag reachable from HEAD, mirroring
          # jira-on-staging's "previous successful deploy" lookup but keyed on release tags
          # instead of Pages deployments.
          PREV=$(git tag --sort=-creatordate --merged "$CURRENT_SHA" | grep -Fxv "$REF_NAME" | head -n1)
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            RANGE="$PREV..$CURRENT_SHA"
          else
            echo "::notice::No previous release tag resolved - falling back to this push only."
            RANGE="$CURRENT_SHA~1..$CURRENT_SHA"
          fi
          echo "Commit range: $RANGE"

          KEYS=$(git log --format=%s%n%b "$RANGE" | grep -oE "$PKEY-[0-9]+" | sort -u)
          if [ -z "$KEYS" ]; then
            echo "::notice::No $PKEY keys in range - nothing to comment."
            exit 0
          fi

          for K in $KEYS; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -u "$MAIL:$ATLASSIAN_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"body\":\"Shipped to TestFlight as $VERSION. Run: $RUN_URL\"}" \
              "$BASE/rest/api/3/issue/$K/comment")
            if [ "$CODE" = "201" ]; then
              echo "$K -> commented ($VERSION)"
            else
              echo "::warning::$K comment failed with HTTP $CODE."
            fi
          done
          exit 0
