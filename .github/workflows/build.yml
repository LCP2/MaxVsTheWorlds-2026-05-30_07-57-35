name: Build & Deploy (WebGL)

# Runs on every push to main. Compiles the project, runs all tests, builds a
# WebGL player, and publishes it to GitHub Pages so Lee can play the latest
# build by clicking a link - no editor, no local build step.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # queue builds; a new push waits its turn (MV-343)

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write
  deployments: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Compile + run EditMode tests. If this fails, no build ships.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          # MV-460: Assets/** deliberately NOT in the key. It changes on every commit, so the
          # exact key never hit, every run fell back to restore-keys AND uploaded a fresh ~GB
          # cache. Unity reimports changed assets from a restored Library anyway.
          # MV-517: key is now scoped per-job (was identical to build's key, so whichever
          # job saved second found the entry already there and silently skipped saving).
          key: Library-editmode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-editmode-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto # reads ProjectSettings/ProjectVersion.txt
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 1b. MV-309: the boot-and-play check. Runs in parallel and gates NOTHING.
  #     It reports only. It is deliberately not a dependency of build (a red
  #     play-check must never stop the site updating) and, since 11 Aug, not a
  #     dependency of jira-on-staging either.
  #
  #     WHY THE TIMEOUT IS LOAD-BEARING: Unity PlayMode in batch mode does not
  #     stream output and can hang indefinitely. On 11 Aug it ran 4h20m without
  #     finishing. A run is not "complete" until every job is, so that one hung
  #     job held the concurrency group for four hours: runs #314-#321 all sat
  #     pending and were superseded, nothing deployed, and every finished ticket
  #     stranded in QA Running. Never remove timeout-minutes from this job, and
  #     never make anything depend on it until that suite is proven to terminate.
  # ---------------------------------------------------------------------------
  playcheck:
    name: Play-check (PlayMode)
    # MV-460 / MV-464: PARKED. This job has not completed since the suite outgrew its
    # timeout - it is cancelled at 20m on every run, which turns every run red and hides
    # genuine failures (it masked the real red on run #441). It gates nothing, so parking
    # it loses no signal. The timeout and the comment below stay: un-parking without
    # fixing the suite reinstates the four-hour hang described there.
    # Re-enable when MV-464 has moved the ~423 disguised unit tests to EditMode and the
    # remaining play-check runs in minutes.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          # MV-460: Assets/** deliberately NOT in the key. It changes on every commit, so the
          # exact key never hit, every run fell back to restore-keys AND uploaded a fresh ~GB
          # cache. Unity reimports changed assets from a restored Library anyway.
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. Build the WebGL player.
  #     MV-517: no longer needs: test, so the two Unity jobs run in parallel
  #     instead of paying for test's wall clock twice. deploy below gates on
  #     both, so nothing untested still reaches Pages.
  # ---------------------------------------------------------------------------
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          # MV-460: Assets/** deliberately NOT in the key. It changes on every commit, so the
          # exact key never hit, every run fell back to restore-keys AND uploaded a fresh ~GB
          # cache. Unity reimports changed assets from a restored Library anyway.
          # MV-517: key is now scoped per-job - see the matching note on test's cache step.
          key: Library-webgl-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-webgl-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
      # GameCI writes the player to build/WebGL/. If the first run 404s on Pages,
      # the index.html is one level deeper (build/WebGL/WebGL) - adjust path below.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

  # ---------------------------------------------------------------------------
  # 3. Publish the WebGL build to GitHub Pages -> the "play the latest" link.
  #     MV-517: now needs both build and test, since build no longer depends
  #     on test directly.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Pages
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 4. MV-344: tell Jira which tickets are now live on the Pages build.
  #     On Staging means published AND playable, so it is set here - never by
  #     the worker at push time, which cannot see its own deploy. Covers every
  #     commit since the last successful deploy, because a queued run that is
  #     superseded never fires its own build. Never fails the deploy.
  # ---------------------------------------------------------------------------
  jira-on-staging:
    name: Mark deployed tickets On Staging
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transition deployed tickets to On Staging
        env:
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${ATLASSIAN_API_TOKEN:-}" ]; then
            echo "::notice::ATLASSIAN_API_TOKEN not set - skipping Jira transition."
            exit 0
          fi
          BASE=$(jq -r '.jiraBaseUrl' pipeline.config.json)
          MAIL=$(jq -r '.jiraEmail' pipeline.config.json)
          PKEY=$(jq -r '.jiraProjectKey' pipeline.config.json)
          echo "Jira $BASE, project $PKEY"
          PREV=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/deployments?environment=github-pages&per_page=100" \
            | jq -r --arg cur "$CURRENT_SHA" '[.[] | select(.sha != $cur)][0].sha // empty')
          if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
            RANGE="$PREV..$CURRENT_SHA"
          else
            echo "::notice::No previous deployment resolved - falling back to this push only."
            RANGE="$CURRENT_SHA~1..$CURRENT_SHA"
          fi
          echo "Commit range: $RANGE"
          KEYS=$(git log --format=%s%n%b "$RANGE" | grep -oE "$PKEY-[0-9]+" | sort -u)
          if [ -z "$KEYS" ]; then
            echo "::notice::No $PKEY keys in range - nothing to transition."
            exit 0
          fi
          for K in $KEYS; do
            ST=$(curl -sS -u "$MAIL:$ATLASSIAN_API_TOKEN" -H "Accept: application/json" \
              "$BASE/rest/api/3/issue/$K?fields=status" | jq -r '.fields.status.name // empty')
            if [ "$ST" != "QA Running" ] && [ "$ST" != "Developing" ]; then
              echo "::notice::$K is $ST - leaving it alone."
              continue
            fi
            TID=$(curl -sS -u "$MAIL:$ATLASSIAN_API_TOKEN" -H "Accept: application/json" \
              "$BASE/rest/api/3/issue/$K/transitions" \
              | jq -r '[.transitions[] | select(.to.name=="On Staging")][0].id // empty')
            if [ -z "$TID" ]; then
              echo "::warning::$K has no On Staging transition from $ST - skipped."
              continue
            fi
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -u "$MAIL:$ATLASSIAN_API_TOKEN" -H "Content-Type: application/json" \
              --data "{\"transition\":{\"id\":\"$TID\"}}" \
              "$BASE/rest/api/3/issue/$K/transitions")
            if [ "$CODE" = "204" ]; then
              echo "$K -> On Staging"
              curl -sS -o /dev/null -X PUT -u "$MAIL:$ATLASSIAN_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"update":{"labels":[{"remove":"cc-active"}]}}' \
                "$BASE/rest/api/3/issue/$K" || true
            else
              echo "::warning::$K transition failed with HTTP $CODE."
            fi
          done
          exit 0
